# Builds the self-hosted server + dashboard images for the orshih6 fork and pushes
# them to GHCR. Not part of upstream mem0.
#
#   gh workflow run selfhost-images.yml -R orshih6/mem0 --ref main
#
# Images:
#   ghcr.io/orshih6/mem0-server     (server/selfhost.Dockerfile, context = repo root)
#   ghcr.io/orshih6/mem0-dashboard  (server/dashboard/Dockerfile)
# Tags: sha-<full commit sha>, latest (default branch), and the tag name for selfhost-v* tags.
name: Self-host images

on:
  workflow_dispatch:
  push:
    tags: ['selfhost-v*']

concurrency:
  group: selfhost-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: github.repository_owner == 'orshih6'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mem0-server
            context: .
            file: server/selfhost.Dockerfile
          - name: mem0-dashboard
            context: server/dashboard
            file: server/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
